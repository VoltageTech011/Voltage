<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Voltage — WhatsApp Pairing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
            color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(92%, 430px);
            padding: 32px;
            border: 1px solid #242424;
            border-radius: 18px;
            background: #101010;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            color: #929292;
            line-height: 1.5;
        }

        input,
        button {
            width: 100%;
            height: 48px;
            border-radius: 10px;
            font-size: 15px;
        }

        input {
            padding: 0 14px;
            margin: 12px 0;
            border: 1px solid #2c2c2c;
            outline: none;
            background: #080808;
            color: white;
        }

        button {
            border: 0;
            background: white;
            color: black;
            font-weight: 700;
            cursor: pointer;
        }

        .code {
            margin-top: 22px;
            padding: 18px;
            border: 1px dashed #333;
            border-radius: 12px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 5px;
        }

        .status {
            margin-top: 16px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Voltage</h1>

        <p>
            Connect the Voltage WhatsApp session using
            an 8-character pairing code.
        </p>

        <input
            id="number"
            type="tel"
            placeholder="2348012345678"
            autocomplete="off"
        >

        <button onclick="pair()">
            Generate Pairing Code
        </button>

        <div id="code" class="code">
            --------
        </div>

        <div id="status" class="status">
            Checking Voltage...
        </div>
    </main>

    <script>
        async function pair() {
            const number =
                document.getElementById("number").value.trim();

            const status =
                document.getElementById("status");

            const code =
                document.getElementById("code");

            status.textContent = "Generating pairing code...";
            code.textContent = "--------";

            try {
                const response = await fetch(
                    "/api/whatsapp/pair",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ number })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Pairing failed."
                    );
                }

                code.textContent =
                    data.code || "--------";

                status.textContent =
                    "Enter this code in WhatsApp → Linked Devices.";
            } catch (error) {
                status.textContent =
                    error.message;
            }
        }

        async function refreshStatus() {
            try {
                const response =
                    await fetch("/api/whatsapp");

                const data =
                    await response.json();

                if (data.state === "connected") {
                    document.getElementById("status")
                        .textContent =
                        `Connected: ${data.number || "WhatsApp"}`;
                } else if (data.state) {
                    document.getElementById("status")
                        .textContent =
                        `Voltage: ${data.state}`;
                }
            } catch {}
        }

        refreshStatus();

        setInterval(refreshStatus, 3000);
    </script>
</body>
</html>
